<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js"></script>
    <title>BestellApp</title>
</head>

<body>
    <header>
        <img class="header-logo" src="./assets/icon/Logo.svg" alt="Logo der Bestell App">
        <img class="header-burger-menu" src="./assets/icon/burger_menu.svg" alt="burger menu Icon">
    </header>
    <main>
        <section class="hero">
            <div class="hero-banner">
                <img src="./assets/icon/Burger_Logo.png" alt="Burger House Logo">
            </div>

            <div class="hero-title-wrapper">
                <h1><b>Burger</b>House</h1>
                <div class="hero-rating-wrapper">
                    <img src="./assets/icon/star.svg" alt="Star icon">
                    <span><b>4,1</b> (317)</span>
                </div>
            </div>
            <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
        </section>
        <section class="menu-main">
            <div class="basket">

            </div>
            <section class="menu-burger menu">
                <div class="menu-title-bg">
                    <div class="menu-title">
                        <img src="./assets/icon/Chanese.svg" alt="Burger icon">
                        <h2>Burger & Sandwiches</h2>
                    </div>
                </div>

            </section>
            <section class="menu-pizza menu">
                <div class="menu-title-bg">
                <div class="menu-title">
                    <img src="./assets/icon/Pizza.svg" alt="Pizza icon">
                    <h2>Pizza (30cm)</h2>
                    </div>
                </div>

            </section>
            <section class="menu-salad menu">
                <div class="menu-title-bg">
                <div class="menu-title">
                    <img src="./assets/icon/Salad.svg" alt="Salad icon">
                    <h2>Salad</h2>
                    </div>
                </div>

            </section>
        </section>

    </main>
    <footer>

    </footer>
</body>

</html>
